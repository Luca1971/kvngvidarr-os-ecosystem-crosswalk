    async function sbQuery(table, opts) {
      opts = opts || {};
      const client = createSupabaseClient();
      if (!client) {
        return createError('SUPABASE_ANON_KEY_MISSING — set window.__SUPABASE_ANON_KEY__ to the publishable anon key');
      }
      try {
        let q = client.from(table).select(opts.select || '*');
        if (opts.order) {
          const col = Array.isArray(opts.order) ? opts.order[0] : opts.order;
          const ascending = Array.isArray(opts.order) ? (opts.order[1] !== false) : true;
          q = q.order(col, { ascending: ascending });
        }
        if (opts.limit) q = q.limit(opts.limit);
        const result = await q;
        if (result.error) {
          return createError('QUERY_FAILED (' + table + '): ' + (result.error.message || result.error.code || String(result.error)));
        }
        const data = result.data;
        if (!data || (Array.isArray(data) && data.length === 0)) {
          return createEmptyResult();
        }
        return createSuccess(data);
      } catch (e) {
        return createError('QUERY_FAILED (' + table + '): ' + (e.message || String(e)));
      }
    }

    function StatusPill({ status, children }) {
      const s = (status || '').toUpperCase();
      let cls = 'pill';
      if (s.includes('VERIFIED') || s === 'ACTIVE' || s === 'SUCCESS') cls += ' verified';
      else if (s.includes('PROVISIONAL') || s.includes('PENDING') || s === 'OPEN' || s === 'MOCK') cls += ' provisional';
      else if (s.includes('ERROR') || s.includes('FAILED') || s === 'QUERY_FAILED') cls += ' error';
      else if (s.includes('EMPTY') || s === 'NOT AVAILABLE') cls += ' empty';
      else if (s.includes('LIVE')) cls += ' live';
      else cls += ' info';
      return <span className={cls}>{children || status}</span>;
    }

    function ResultRenderer({ result, emptyLabel = 'EMPTY IN STRUCTURED STATE', children }) {
      if (!result) return <div className="alert empty">No result</div>;
      if (result.status === 'loading') return <div className="alert info">Loading…</div>;
      if (result.status === 'error') return <div className="alert error">QUERY_FAILED — {result.error}</div>;
      if (result.status === 'empty' || (Array.isArray(result.data) && result.data.length === 0)) {
        return <div className="alert empty">{emptyLabel}</div>;
      }
      return children(result.data);
    }

      return currency ? `${formatted} ${currency}` : formatted;
    }

      const executions = useAsyncResult(() => provider.getTradingExecutions());
      const observations = useAsyncResult(() => provider.getTradingObservations());
      const validations = useAsyncResult(() => provider.getTradingValidations());
      const cap = capital.status === 'success' && capital.data.length ? capital.data[0] : null;

      return (
        <div className="stack">
          <div className="alert warning">
            Trading capital and liquidity are separate systems. NEVER treat trading equity as distributable cash. Only actual verified proceeds/funding records may enter liquidity reporting. NEVER infer authorization from equity alone.
          </div>

          <div className="grid grid-2">
            <div className="card">
              <div className="card-label">Account</div>
              <ResultRenderer result={accounts}>
                {(rows) => {
                  const a = rows[0];
                  return (
                    <>
                      <div className="card-value" style={{ fontSize: '1rem' }}>{a.account_name}</div>
                      <div className="card-sub">
                        Firm: {a.prop_firm} · Program: {a.program}<br />
                        Starting: {formatMoney(a.starting_balance, 'USD')} · Activation: {formatMoney(a.activation_cost_usd, 'USD')}<br />
                        <StatusPill status={a.status}>{a.status}</StatusPill> · Provenance: {a.funding_provenance}
                      </div>
                    </>
                  );
                }}
              </ResultRenderer>
            </div>
            <div className="card">
              <div className="card-label">Capacity & Governance</div>
              {cap ? (
                <>
                  <div className="row" style={{ marginTop: '0.35rem' }}>
                    <StatusPill status={cap.capacity_status}>{cap.capacity_status}</StatusPill>
                    <StatusPill status={cap.governance_status}>{cap.governance_status}</StatusPill>
                  </div>
                  <div className="card-sub" style={{ marginTop: '0.5rem' }}>
                    Authorized lot: {cap.authorized_lot} · Stop: {cap.authorized_stop_points} pts · Risk: ${cap.authorized_risk_usd}<br />
                    Capital band: ${cap.capital_band_min} — ${cap.capital_band_max}
                  </div>
                </>
              ) : <div className="card-sub">No capital state</div>}
            </div>
          </div>

          <div>
            <div className="section-title">Capital State</div>
            {cap ? (
              <div className="grid grid-4">
                <div className="card"><div className="card-label">Stable Equity</div><div className="card-value gold">{formatMoney(cap.stable_equity, 'USD')}</div></div>
                <div className="card"><div className="card-label">Floating P&L</div><div className="card-value">{formatMoney(cap.floating_pnl, 'USD')}</div></div>
                <div className="card"><div className="card-label">Realized Day</div><div className={`card-value ${cap.realized_day_pnl < 0 ? 'negative' : 'positive'}`}>{formatMoney(cap.realized_day_pnl, 'USD')}</div></div>
                <div className="card"><div className="card-label">Realized Week</div><div className={`card-value ${cap.realized_week_pnl < 0 ? 'negative' : 'positive'}`}>{formatMoney(cap.realized_week_pnl, 'USD')}</div></div>
                <div className="card"><div className="card-label">Cumulative Realized</div><div className={`card-value ${cap.cumulative_realized_pnl < 0 ? 'negative' : 'positive'}`}>{formatMoney(cap.cumulative_realized_pnl, 'USD')}</div></div>
                <div className="card"><div className="card-label">Net Profit Pool</div><div className="card-value">{formatMoney(cap.net_profit_pool, 'USD')}</div><div className="card-sub">Required: {formatMoney(cap.required_profit_pool, 'USD')}</div></div>
                <div className="card"><div className="card-label">Consistency Gap</div><div className="card-value warning">{formatMoney(cap.consistency_gap, 'USD')}</div></div>
                <div className="card"><div className="card-label">Prev Equity High</div><div className="card-value">{formatMoney(cap.previous_equity_high, 'USD')}</div><div className="card-sub">Biggest day: {formatMoney(cap.biggest_profitable_day, 'USD')}</div></div>
              </div>
            ) : <div className="alert empty">EMPTY IN STRUCTURED STATE</div>}
          </div>

          <div>
            <div className="section-title">Recent Executions (≠ Observations ≠ Validations)</div>
            <ResultRenderer result={executions}>
              {(rows) => (
                <div className="table-wrap">
                  <table>
                    <thead><tr><th>Date</th><th>Time NY</th><th>Session</th><th>Instrument</th><th>Type</th><th>Dir</th><th>Lot</th><th>P&L</th><th>Risk</th><th>Validation</th></tr></thead>
                    <tbody>
                      {rows.map(r => (
                        <tr key={r.id}>
                          <td>{r.trading_date}</td>
                          <td>{r.event_time_ny}</td>
                          <td>{r.session}</td>
                          <td>{r.instrument}</td>
                          <td><StatusPill status={r.event_type}>{r.event_type}</StatusPill></td>
                          <td>{r.direction}</td>
                          <td>{r.lot}</td>
                          <td className={r.realized_pnl_usd < 0 ? 'negative' : r.realized_pnl_usd > 0 ? 'positive' : ''}>
                            {r.realized_pnl_usd != null ? formatMoney(r.realized_pnl_usd, 'USD') : '—'}
                          </td>
                          <td>${r.risk_usd}</td>
                          <td><StatusPill status={r.validation_state}>{r.validation_state}</StatusPill></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </ResultRenderer>
          </div>

          <div className="grid grid-2">
            <div>
              <div className="section-title">Observations</div>
              <ResultRenderer result={observations} emptyLabel="EMPTY IN STRUCTURED STATE">
                {(rows) => (
                  <div className="stack">
                    {rows.map(o => (
                      <div className="card" key={o.id}>
                        <div className="card-header"><strong>{o.title}</strong><StatusPill status={o.state}>{o.state}</StatusPill></div>
                        <div className="card-sub">{o.observation}</div>
                        <div className="provenance">Freq: {o.frequency_count} · First: {o.first_observed_at} · Last: {o.last_observed_at}</div>
                      </div>
                    ))}
                  </div>
                )}
              </ResultRenderer>
            </div>
            <div>
              <div className="section-title">Validations</div>
              <ResultRenderer result={validations} emptyLabel="EMPTY IN STRUCTURED STATE">
                {(rows) => (
                  <div className="stack">
                    {rows.map(v => (
                      <div className="card" key={v.id}>
                        <div className="card-header"><strong>Hypothesis {v.hypothesis_id}</strong><StatusPill status={v.result}>{v.result}</StatusPill></div>
                        <div className="card-sub">Support {v.supporting_count} / Contradict {v.contradictory_count} · Persistence {(v.persistence_rate * 100).toFixed(0)}%<br />Decision: {v.decision}</div>
                        <div className="provenance">{v.evidence_summary}</div>
                      </div>
                    ))}
                  </div>
                )}
              </ResultRenderer>
            </div>
          </div>
        </div>
      );
    }

    function DomainsTab({ provider }) {
      const domains = useAsyncResult(() => provider.getBusinessDomains());
      const musicAud = useAsyncResult(() => provider.getMusicAudience());
      const musicRet = useAsyncResult(() => provider.getMusicRetention());
      const content = useAsyncResult(() => provider.getContentAssets());
      const campaigns = useAsyncResult(() => provider.getMarketingCampaigns());
      const projects = useAsyncResult(() => provider.getCreativeProjects());

      return (
        <div className="stack">
          <div className="alert info">
            Business domains are independent OS domains. If a domain-specific table has zero rows: display EMPTY IN STRUCTURED STATE. Do NOT display INACTIVE / NONEXISTENT / NOT OPERATING. Absence from one system layer is not proof of absence from the wider distributed OS.
          </div>

          <div>
            <div className="section-title">os_business_domains</div>
            <ResultRenderer result={domains}>
              {(rows) => (
                <div className="table-wrap">
                  <table>
                    <thead><tr><th>Domain Key</th><th>Name</th><th>Type</th><th>Purpose</th><th>Status</th><th>Authority</th></tr></thead>
                    <tbody>
                      {rows.map(r => (
                        <tr key={r.id}>
                          <td className="mono">{r.domain_key}</td>
                          <td>{r.name}</td>
                          <td>{r.domain_type}</td>
                          <td>{r.purpose}</td>
                          <td><StatusPill status={r.status}>{r.status}</StatusPill></td>
                          <td>{r.authority_scope}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </ResultRenderer>
          </div>

          <div>
            <div className="section-title">Music Business — Audience</div>
            <ResultRenderer result={musicAud} emptyLabel="EMPTY IN STRUCTURED STATE">
              {(rows) => (
                <div className="table-wrap">
                  <table>
                    <thead><tr><th>Period</th><th>Monthly Listeners</th><th>Active</th><th>Super</th><th>New</th></tr></thead>
                    <tbody>
                      {rows.map(r => (
                        <tr key={r.id}>
                          <td>{r.period_month}</td>
                          <td>{r.monthly_listeners}</td>
                          <td>{r.active_listeners}</td>
                          <td>{r.super_listeners}</td>
                          <td>{r.new_listeners ?? '—'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </ResultRenderer>
          </div>

          <div>
            <div className="section-title">Music Business — Retention</div>
            <ResultRenderer result={musicRet} emptyLabel="EMPTY IN STRUCTURED STATE">
              {(rows) => (
                <div className="table-wrap">
                  <table>
                    <thead><tr><th>Period</th><th>Active Contribution %</th><th>Previously Active %</th><th>Programmed %</th></tr></thead>
                    <tbody>
                      {rows.map(r => (
                        <tr key={r.id}>
                          <td>{r.period_month}</td>
                          <td>{r.active_listener_contribution_pct}%</td>
                          <td>{r.previously_active_pct}%</td>
                          <td>{r.programmed_listeners_pct}%</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </ResultRenderer>
          </div>

          <div className="grid grid-3">
            <div className="card">
              <div className="card-label">Content Assets</div>
              <ResultRenderer result={content} emptyLabel="EMPTY IN STRUCTURED STATE">
                {(rows) => <div className="card-value">{rows.length} assets</div>}
              </ResultRenderer>
            </div>
            <div className="card">
              <div className="card-label">Marketing Campaigns</div>
              <ResultRenderer result={campaigns} emptyLabel="EMPTY IN STRUCTURED STATE">
                {(rows) => <div className="card-value">{rows.length} campaigns</div>}
              </ResultRenderer>
            </div>
            <div className="card">
              <div className="card-label">Creative Projects</div>
              <ResultRenderer result={projects} emptyLabel="EMPTY IN STRUCTURED STATE">
                {(rows) => <div className="card-value">{rows.length} projects</div>}
              </ResultRenderer>
            </div>
          </div>
        </div>
      );
    }

    function LLMTab({ provider }) {
      const caps = useAsyncResult(() => provider.getLLMCapabilities());
      const mem = useAsyncResult(() => provider.getLLMMemoryProtocol());
      const routing = useAsyncResult(() => provider.getLLMRoutingRules());
      const handoff = useAsyncResult(() => provider.getLLMHandoffRules());
      const specs = useAsyncResult(() => provider.getLLMSpecializations());
      const boot = useAsyncResult(() => provider.getLLMBootManifest());

      return (
        <div className="stack">
          <div className="invariant-box">
            <strong>DISTRIBUTED_OS_RECONSTRUCTION_INVARIANT</strong><br />
            Supabase is the canonical structured-state layer. Google Workspace/Drive is the human-readable structural knowledge layer. Operational Prep contains moving/current knowledge. Structural Prep contains durable verified knowledge. Absence from one layer does not prove absence from the OS.
          </div>

          <div className="alert warning">
            Known baseline defect (PROVISIONAL/OPEN): llm_get_boot_contract() does not query llm_memory_operations_protocol. Reconstruction invariant and associated memory rules may be invisible to newly admitted nodes. Do not claim fixed unless verified.
          </div>

          <div>
            <div className="section-title">Capability Registry (evidence-backed)</div>
            <ResultRenderer result={caps}>
              {(rows) => (
                <div className="table-wrap">
                  <table>
                    <thead><tr><th>Platform</th><th>Capability</th><th>Status</th><th>Evidence</th><th>Limitation</th><th>Last Verified</th></tr></thead>
                    <tbody>
                      {rows.map(r => (
                        <tr key={r.id}>
                          <td>{r.platform}</td>
                          <td className="mono">{r.capability}</td>
                          <td><StatusPill status={r.status}>{r.status}</StatusPill></td>
                          <td>{r.evidence}</td>
                          <td className="muted">{r.limitation || '—'}</td>
                          <td>{r.last_verified_at || '—'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </ResultRenderer>
          </div>

          <div>
            <div className="section-title">Memory Operations Protocol</div>
            <ResultRenderer result={mem}>
              {(rows) => (
                <div className="stack">
                  {rows.map(r => (
                    <div className="card" key={r.id}>
                      <div className="card-header">
                        <span className="mono gold">{r.rule_key}</span>
                        <div className="row">
                          <StatusPill status={r.status}>{r.status}</StatusPill>
                          <StatusPill status={r.state}>{r.state}</StatusPill>
                        </div>
                      </div>
                      <div className="card-sub" style={{ marginTop: '0.35rem' }}>{r.instruction}</div>
                      <div className="provenance">Priority {r.priority} · Applies: {r.applies_to} · Authority: {r.authority_scope}{r.human_authorization_required ? ' · HUMAN_AUTH_REQUIRED' : ''}</div>
                    </div>
                  ))}
                </div>
              )}
            </ResultRenderer>
          </div>

          <div className="grid grid-2">
            <div>
              <div className="section-title">Routing Rules</div>
              <ResultRenderer result={routing} emptyLabel="EMPTY IN STRUCTURED STATE">
                {(rows) => (
                  <div className="table-wrap">
                    <table>
                      <thead><tr><th>Domain</th><th>Primary</th><th>Fallback</th><th>Reason</th><th>Active</th></tr></thead>
                      <tbody>
                        {rows.map(r => (
                          <tr key={r.id}>
                            <td>{r.task_domain}</td>
                            <td>{r.primary_platform}</td>
                            <td>{(r.fallback_platforms || []).join(', ')}</td>
                            <td className="muted">{r.routing_reason}</td>
                            <td>{r.active ? 'Yes' : 'No'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </ResultRenderer>
            </div>
            <div>
              <div className="section-title">Handoff Rules</div>
              <ResultRenderer result={handoff} emptyLabel="EMPTY IN STRUCTURED STATE">
                {(rows) => (
                  <div className="table-wrap">
                    <table>
                      <thead><tr><th>From</th><th>To</th><th>Trigger</th><th>Payload</th><th>Active</th></tr></thead>
                      <tbody>
                        {rows.map(r => (
                          <tr key={r.id}>
                            <td>{r.from_platform}</td>
                            <td>{r.to_platform}</td>
                            <td>{r.trigger_condition}</td>
                            <td className="mono">{r.handoff_payload}</td>
                            <td>{r.active ? 'Yes' : 'No'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </ResultRenderer>
            </div>
          </div>

          <div>
            <div className="section-title">Specialization Registry</div>
            <ResultRenderer result={specs}>
              {(rows) => (
                <div className="stack">
                  {rows.map(r => (
                    <div className="card" key={r.id}>
                      <div className="card-header">
                        <strong>{r.platform} / {r.model_or_family}</strong>
                        <StatusPill status={r.evidence_status}>{r.evidence_status}</StatusPill>
                      </div>
                      <div className="card-sub">
                        Role: {r.role} · Specialization: {r.specialization}<br />
                        Preferred: {(r.preferred_workloads || []).join(', ')}<br />
                        Strengths: {r.unique_strengths}<br />
                        Limitations: {r.limitations || '—'}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </ResultRenderer>
          </div>

          <div>
            <div className="section-title">Boot Manifest</div>
            <ResultRenderer result={boot}>
              {(rows) => (
                <div className="table-wrap">
                  <table>
                    <thead><tr><th>Key</th><th>Value</th><th>Version</th><th>Authority</th><th>Active</th></tr></thead>
                    <tbody>
                      {rows.map((r, i) => (
                        <tr key={i}>
                          <td className="mono">{r.key}</td>
                          <td style={{ maxWidth: '420px', whiteSpace: 'normal' }}>{r.value}</td>
                          <td>{r.version}</td>
                          <td>{r.authority}</td>
                          <td>{r.active ? 'Yes' : 'No'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </ResultRenderer>
          </div>
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState('command');
      const provider = PROVIDER;
      const tabs = [
        { id: 'command', label: 'Command Center' },
        { id: 'liquidity', label: 'Liquidity' },
        { id: 'trading', label: 'Trading' },
        { id: 'domains', label: 'Domains' },
        { id: 'llm', label: 'LLM OS' },
      ];

      return (
        <>
          <header className="app-header">
            <div className="brand">
              <div className="brand-mark">KV</div>
              <div className="brand-text">
                <h1>KVNGVIDARR OS</h1>
                <p>Ecosystem Crosswalk</p>
              </div>
            </div>
            <div className="status-bar">
              {provider.isMock ? <StatusPill status="MOCK">DEVELOPMENT / MOCK STATE</StatusPill> : <StatusPill status="LIVE">LIVE SUPABASE</StatusPill>}
              <StatusPill status="info">Provider: {provider.name}</StatusPill>
              <StatusPill status="info">Schema: VERIFIED</StatusPill>
            </div>
          </header>
          <nav className="tabs">
            {tabs.map(t => (
              <button key={t.id} className={tab === t.id ? 'active' : ''} onClick={() => setTab(t.id)}>{t.label}</button>
            ))}
          </nav>
          <main>
            {tab === 'command' && <CommandCenter provider={provider} />}
            {tab === 'liquidity' && <LiquidityTab provider={provider} />}
            {tab === 'trading' && <TradingTab provider={provider} />}
            {tab === 'domains' && <DomainsTab provider={provider} />}
            {tab === 'llm' && <LLMTab provider={provider} />}
          </main>
          <footer>
            KVNGVIDARR OS · Ecosystem Crosswalk · Backend-independent UI · Mock → Supabase swap without presentation rebuild · Snapshot reference 2026-08-20 · Provenance-aware · No currency aggregation without verified conversion · Equity ≠ Liquidity
          </footer>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
